[package]
name = "ejgames"
version = "0.2.1"
description = "ejGames — launcher de juegos personalizable"
authors = ["ej"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ejgames_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-autostart = "2.5"
tauri-plugin-window-state = "2.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.11"
walkdir = "2.5"
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "gif", "bmp"] }
notify = "8.2"
discord-rich-presence = "1.1"
strsim = "0.11"
regex = "1.11"
parking_lot = "0.12"
blake3 = "1.8"
url = "2.5"
percent-encoding = "2.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_Media_Audio",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
