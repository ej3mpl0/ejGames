[package]
name = "ejgames"
version = "0.9.4"
description = "ejGames — launcher de juegos personalizable"
authors = ["ej"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "ejgames_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-autostart = "2.5"
tauri-plugin-window-state = "2.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "net"] }
futures = "0.3"
# Raíces de Mozilla y además las de Windows: los antivirus que inspeccionan
# HTTPS (y los proxies de empresa) ponen la suya ahí; sin ella, error de certificado.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "gzip", "stream", "cookies"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.11"
walkdir = "2.5"
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "gif", "bmp"] }
notify = "8.2"
discord-rich-presence = "1.1"
strsim = "0.11"
regex = "1.11"
parking_lot = "0.12"
blake3 = "1.8"
sha2 = "0.10"
hmac = "0.12"
url = "2.5"
percent-encoding = "2.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Guías de Steam: su HTML se recorre y se convierte en bloques seguros (sin HTML).
scraper = { version = "0.24", default-features = false }
ego-tree = "0.10"
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
base64 = "0.22"
mime_guess = "2"
# Torrents (Explorar → Descargas). Sin las funciones por defecto: `default-tls`
# arrastra aws-lc-rs. SHA-1 con la CryptoAPI de Windows y TLS de los trackers
# https con SChannel (el `reqwest` 0.13 de librqbit toma `native-tls` de aquí).
librqbit = { version = "=9.0.1", default-features = false }
librqbit-core = { version = "=9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Power",
  "Win32_Storage_FileSystem",
  # Overlay: capturas (duplicación de escritorio), rendimiento (PDH) y música (controles multimedia de Windows).
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
] }

[patch.crates-io]
# DHT que no muere en Windows con el error UDP 10054 (ver vendor/README.md).
librqbit-dht = { path = "vendor/librqbit-dht" }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
# "unwind": un panic en una tarea de librqbit no debe cerrar el launcher.
panic = "unwind"
