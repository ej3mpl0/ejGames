<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- La ficha: disco rojo con ranura sobre tinta, con la trama de puntos del instalador. -->
  <defs>
    <pattern id="trama" width="38" height="38" patternUnits="userSpaceOnUse" x="13" y="0">
      <circle cx="19" cy="19" r="7.5" fill="#ff3a2d"/>
    </pattern>
    <linearGradient id="fundido" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0.2" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mascara"><rect x="0" y="595" width="1024" height="429" fill="url(#fundido)"/></mask>
    <clipPath id="cuadro"><rect x="32" y="32" width="960" height="960" rx="200"/></clipPath>
  </defs>
  <g clip-path="url(#cuadro)">
    <rect x="32" y="32" width="960" height="960" fill="#0e0e10"/>
    <rect x="32" y="595" width="960" height="397" fill="url(#trama)" mask="url(#mascara)"/>
  </g>
  <circle cx="512" cy="490" r="285" fill="#ff3a2d"/>
  <circle cx="512" cy="490" r="217" fill="none" stroke="#0e0e10" stroke-width="19"/>
  <rect x="381" y="460" width="262" height="60" fill="#0e0e10"/>
</svg>
