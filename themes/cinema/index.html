<!doctype html>
<html lang="es" data-view="home">
  <head>
    <meta charset="utf-8" />
    <title>Cinema</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="store.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="nav" data-ejg-drag>
      <span class="logo">EJ<b>GAMES</b></span>
      <nav class="links" data-ejg-nodrag>
        <button data-focus data-go="top" id="nav-home">Inicio</button>
        <button data-focus id="nav-explore">Explorar</button>
        <button data-focus id="nav-dl">Mis descargas<span class="nbadge" id="dl-count" hidden></span></button>
        <button data-focus data-go="row-fav">Mi lista</button>
        <button data-focus data-action="collections">Colecciones</button>
        <button data-focus data-action="stats">Estadísticas</button>
      </nav>
      <div class="tools" data-ejg-nodrag>
        <div class="nsearch" id="nsearch">
          <button class="ib" data-focus id="nav-search" title="Buscar"><svg viewBox="0 0 24 24"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" /></svg></button>
          <input id="nav-q" data-focus placeholder="Títulos, géneros, compañías" spellcheck="false" autocomplete="off" />
        </div>
        <button class="ib dl-ind" data-focus id="dl-ind" title="Mis descargas" hidden>
          <svg class="dl-ring" viewBox="0 0 36 36"><circle class="rg-bg" cx="18" cy="18" r="16" /><circle class="rg-fg" cx="18" cy="18" r="16" pathLength="100" /></svg>
          <svg class="dl-arrow" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14" /></svg>
          <i class="dl-dot"></i>
        </button>
        <button class="ib" data-focus data-action="settings" title="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1m0-14.2-2.1 2.1m-10 10-2.1 2.1" /></svg></button>
        <button class="avatar" data-focus data-action="profiles" id="avatar" title="Perfiles"></button>
      </div>
    </header>
    <main id="main">
      <section class="hero" id="hero">
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-fade"></div>
        <div class="hero-info" id="hero-info"></div>
      </section>
      <div id="rows"></div>
      <div id="shop"></div>
    </main>
    <div id="hints" class="hints"></div>
    <div id="modal" hidden></div>
  </body>
</html>
