<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Moneda</title>
    <link rel="stylesheet" href="/_sdk/kit/guides.css" />
    <link rel="stylesheet" href="/_sdk/kit/homebrew.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="store.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="wallpaper"></div>
    <header class="top" data-ejg-drag>
      <button class="brand" data-focus data-ejg-nodrag id="brand" title="Inicio" aria-label="Inicio">
        <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true" class="brand-ico"><circle cx="50" cy="50" r="50" fill="#ff3a2d"/><circle cx="50" cy="50" r="38" fill="none" stroke="#141315" stroke-width="4"/><rect x="27" y="44" width="46" height="12" fill="#141315"/></svg>
      </button>
      <nav class="tabs" data-ejg-nodrag>
        <button class="tab" data-focus data-tab="home">Inicio</button>
        <button class="tab" data-focus data-tab="library">Biblioteca</button>
        <button class="tab" data-focus data-tab="store" id="tab-store">Tienda</button>
        <button class="tab" data-focus data-tab="homebrew">Homebrew</button>
      </nav>
      <div class="grow"></div>
      <div class="top-actions" data-ejg-nodrag>
        <label class="search-pill">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="top-search" data-focus spellcheck="false" autocomplete="off" placeholder="Buscar en tu biblioteca" aria-label="Buscar" />
          <kbd>/</kbd>
        </label>
        <button class="round" data-focus id="dl-btn" title="Descargas">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="42"/><circle class="ring-on" cx="50" cy="50" r="42" pathLength="100"/></svg>
          <svg class="ico-dl" viewBox="0 0 24 24"><path d="M12 6v11m0 0-4-4m4 4 4-4"/></svg>
        </button>
        <button class="round" data-focus data-action="stats" title="Estadísticas"><svg viewBox="0 0 24 24"><path d="M5 19.5v-6M10 19.5v-11M15 19.5v-8M20 19.5v-14"/></svg></button>
        <button class="round" data-focus data-action="settings" title="Ajustes (Ctrl+,)"><svg viewBox="0 0 24 24"><path d="M4 8h9m4 0h3M4 16h3m4 0h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg></button>
        <button class="avatar-btn" data-focus id="acct-btn" title="Tu perfil"><span class="avatar" id="avatar"></span></button>
        <div class="wins">
          <button data-win="min" title="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
          <button data-win="max" title="Maximizar"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg></button>
          <button data-win="close" class="close" title="Cerrar"><svg viewBox="0 0 12 12"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button>
        </div>
      </div>
    </header>
    <main id="main"></main>
    <div id="hints" class="hints"></div>
    <div id="lightbox" hidden></div>
  </body>
</html>
