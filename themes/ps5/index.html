<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>PS5</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="bg"></div>
    <div class="scrim"></div>
    <header class="top" data-ejg-drag>
      <nav class="tabs" data-ejg-nodrag>
        <button class="tab" data-focus data-tab="home">Juegos</button>
        <button class="tab" data-focus data-tab="library">Biblioteca</button>
      </nav>
      <div class="status" data-ejg-nodrag>
        <button class="ico" data-focus data-action="search" title="Buscar"><svg viewBox="0 0 24 24"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" /></svg></button>
        <button class="ico" data-focus data-action="settings" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" /></svg></button>
        <button class="avatar" data-focus data-action="profiles" id="avatar" title="Perfil"></button>
        <span class="clock" id="clock"></span>
      </div>
    </header>
    <main>
      <section id="home" class="view">
        <div class="row-wrap"><div class="row" id="row" data-focus-group="row"></div></div>
        <div class="hub" id="hub">
          <div class="hub-main">
            <div class="logo-slot" id="logo"></div>
            <div class="meta" id="meta"></div>
            <div class="buttons" data-focus-group="buttons">
              <button class="play" data-focus id="play">Jugar</button>
              <button class="more" data-focus id="edit" title="Opciones (X)">···</button>
              <button class="more fav" data-focus id="fav" title="Favorito (Y)">★</button>
            </div>
            <div class="stats" id="stats"></div>
            <p class="blurb" id="blurb"></p>
          </div>
          <div class="media-row" id="media" data-focus-group="media"></div>
        </div>
      </section>
      <section id="library" class="view" hidden>
        <div class="lib-head">
          <h1>Tu colección</h1>
          <div class="chips" id="chips"></div>
        </div>
        <div class="lib-grid" id="lib-grid" data-focus-group="lib"></div>
      </section>
    </main>
    <footer class="hints" id="hints"></footer>
    <div id="player" hidden></div>
    <div id="viewer" hidden></div>
  </body>
</html>
