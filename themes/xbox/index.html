<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Xbox</title>
    <link rel="stylesheet" href="/_sdk/kit/guides.css" />
    <link rel="stylesheet" href="/_sdk/kit/social.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="store.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="bg"></div>
    <div class="shade"></div>
    <header class="top" data-ejg-drag>
      <button class="me" data-focus data-action="profiles" data-ejg-nodrag>
        <span class="avatar" id="avatar"></span>
        <span class="me-text"><b id="name"></b><small id="status">En línea</small></span>
      </button>
      <nav class="nav" data-ejg-nodrag>
        <button class="navbtn" data-focus data-view="home">Inicio</button>
        <button class="navbtn" data-focus data-view="collection">Mi colección</button>
        <button class="navbtn" data-focus data-view="store" id="nav-store" hidden>Tienda</button>
      </nav>
      <div class="right" data-ejg-nodrag>
        <button class="ib" data-focus id="q-btn" title="Administrar cola" hidden><span class="q-ring"></span><svg viewBox="0 0 24 24"><path d="M4 6h10M4 11h10M4 16h6m8-8v10m0 0-3-3m3 3 3-3" /></svg><span class="ib-badge" id="q-badge"></span></button>
        <button class="ib" data-focus id="friends-btn" title="Amigos" hidden><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5"/></svg><span class="ib-badge" id="fr-badge"></span></button>
        <button class="ib" data-focus data-action="search" title="Buscar"><svg viewBox="0 0 24 24"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" /></svg></button>
        <button class="ib" data-focus data-action="stats" title="Estadísticas"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" /></svg></button>
        <button class="ib" data-focus data-action="settings" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" /></svg></button>
        <span class="clock" id="clock"></span>
      </div>
    </header>
    <main id="home" class="page"></main>
    <main id="collection" class="page" hidden>
      <aside class="filters" id="filters" data-focus-group="filters"></aside>
      <div class="col-body">
        <div class="col-head"><h1 id="col-title">Mi colección</h1><button class="sortbtn" data-focus id="sort"></button></div>
        <div class="grid" id="grid" data-focus-group="grid"></div>
      </div>
    </main>
    <main id="store" class="page" hidden></main>
    <main id="queue" class="page" hidden></main>
    <section id="repack" class="page" data-focus-trap hidden></section>
    <section id="hub" class="page" hidden></section>
    <section id="guides" class="page" data-focus-trap hidden>
      <div class="gx-bg" id="gx-bg"></div>
      <div class="gx-inner" id="gx-inner"></div>
    </section>
    <div id="hints" class="hints"></div>
    <div id="player" hidden></div>
  </body>
</html>
